# ============================================================================
# Email service Service - Docker Compose (Development)
# ============================================================================
#
# USAGE:
#   cd fastapi-email-service
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml logs -f
#   docker compose -f docker/docker-compose.dev.yml down
#
# ACCESS:
#   API:      http://localhost:8081
#   Docs:     http://localhost:8081/docs
#   Health:   http://localhost:8081/health
#   MailHog:  http://localhost:8025 (with --profile tools)
#   PgAdmin:  http://localhost:5051 (with --profile tools)
#
# TOOLS (optional):
#   docker compose -f docker/docker-compose.dev.yml --profile tools up -d
# ============================================================================

name: email-service-dev

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: email_service_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-email_service_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-email_service_password}
      POSTGRES_DB: ${DB_NAME:-email_service_db}
    ports:
      - "${DB_PORT_EXTERNAL:-5433}:5432"
    volumes:
      - email_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - email-service-internal

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: email_service_redis
    ports:
      - "${REDIS_PORT_EXTERNAL:-6380}:6379"
    volumes:
      - email_service_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - email-service-internal

  # ---------------------------------------------------------------------------
  # API (Development - hot reload)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: email_service_api
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      DEBUG: "true"
    ports:
      - "${API_PORT:-8081}:8081"
    volumes:
      - ../app:/app/app:ro
      - ../migrations:/app/migrations:ro
      - ../alembic.ini:/app/alembic.ini:ro
      - email_service_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - email-service-internal
    command: >
      sh -c "
        until pg_isready -h postgres -p 5432 -U $${DB_USER:-email_service_user}; do
          echo 'Waiting for PostgreSQL...'
          sleep 2
        done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting API (development)...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8081 --reload
      "

  # ---------------------------------------------------------------------------
  # Worker (Development)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: email_service_worker
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      DEBUG: "true"
    volumes:
      - ../app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - email-service-internal
    command: arq app.worker.WorkerSettings
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MailHog - SMTP mock for testing (optional)
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: email_service_mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - email-service-internal
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # PgAdmin (optional)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: email_service_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - email_service_pgadmin_data:/var/lib/pgadmin
    networks:
      - email-service-internal
    profiles:
      - tools

volumes:
  email_service_postgres_data:
  email_service_redis_data:
  email_service_pgadmin_data:
  email_service_logs:

networks:
  email-service-internal:
    driver: bridge
